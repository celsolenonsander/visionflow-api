# ═══════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256 (exp 8h). Claims: `sub` (cod_usuario), `iat`, `exp`.
        Header: `Authorization: Bearer <token>`.

  parameters:
    LimitParam:
      name: limit
      in: query
      description: Tamanho da página (padrão 20, máx 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CursorParam:
      name: cursor
      in: query
      description: |
        Cursor de paginação (id do último item da página anterior).
        Null/ausente = primeira página.
      schema:
        type: string

    IdPathParam:
      name: id
      in: path
      required: true
      description: Identificador público (= `codigo` do banco)
      schema:
        type: integer

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            generico:
              value:
                success: false
                data: null
                error:
                  code: REQUISICAO_INVALIDA
                  message: Dados inválidos na requisição.

    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            sem_token:
              value:
                success: false
                data: null
                error:
                  code: NAO_AUTENTICADO
                  message: Token ausente ou expirado.

    Forbidden:
      description: Sem permissão para acessar o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            sem_permissao:
              value:
                success: false
                data: null
                error:
                  code: SEM_PERMISSAO
                  message: Você não tem permissão para acessar este recurso.

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            nao_encontrado:
              value:
                success: false
                data: null
                error:
                  code: RECURSO_NAO_ENCONTRADO
                  message: Recurso não encontrado.

    Conflict:
      description: Conflito (recurso duplicado, etc)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            duplicado:
              value:
                success: false
                data: null
                error:
                  code: RECURSO_DUPLICADO
                  message: Já existe um recurso com estes dados.

    InternalError:
      description: Erro interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponse'
          examples:
            erro:
              value:
                success: false
                data: null
                error:
                  code: ERRO_INTERNO
                  message: Erro inesperado no servidor.          
  schemas:

    # ─── ENVELOPE ────────────────────────────────────────
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código SCREAMING_SNAKE_CASE em português
          example: CLIENTE_NAO_ENCONTRADO
        message:
          type: string
          example: Cliente não encontrado.

    APIResponse:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/APIError'
            - type: 'null'

    # ─── PAGINAÇÃO ───────────────────────────────────────
    CursorPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - 'null'
          description: Cursor da próxima página (null = fim)

    # ─── AUTH ────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: vendedor@distribuidora.com.br
        senha:
          type: string
          format: password
          example: Senha@123

    LoginResponse:
      type: object
      required: [usuario]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'

    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginResponse'

    Usuario:
      type: object
      required: [id, nome, email]
      properties:
        id:
          type: integer
          example: 42
        nome:
          type: string
          example: João da Silva
        email:
          type: string
          format: email
        token:
          type: string
          description: JWT HS256, exp 8h (presente apenas no login)

    # ─── HOME ────────────────────────────────────────────
    Indicador:
      type: object
      required:
        - vendas_mes
        - vendas_hoje
        - pedidos_em_digitacao
        - orcamentos_em_digitacao
        - clientes_em_digitacao
        - pedidos_aguardando_aprovacao
        - agendas_pendentes
        - tarefas_pendentes
        - notificacoes_nao_lidas
      properties:
        vendas_mes:
          type: number
          description: Soma de pedidos no mês corrente (BRL)
        vendas_hoje:
          type: number
          description: Soma de pedidos do dia (BRL)
        pedidos_em_digitacao:
          type: integer
        orcamentos_em_digitacao:
          type: integer
        clientes_em_digitacao:
          type: integer
        pedidos_aguardando_aprovacao:
          type: integer
        agendas_pendentes:
          type: integer
        tarefas_pendentes:
          type: integer
        notificacoes_nao_lidas:
          type: integer

    IndicadorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Indicador'

    # ─── SHELL ───────────────────────────────────────────
    Empresa:
      type: object
      required: [nome, cnpj]
      properties:
        nome:
          type: string
        cnpj:
          type: string
        regional:
          type:
            - string
            - 'null'
          description: Regional comercial (ex Sudeste)
          example: Sudeste
        contato:
          type:
            - string
            - 'null'
          description: 'Contato principal — # TODO: telefone ou email?'
        usuario_logado:
          $ref: '#/components/schemas/Usuario'

    EmpresaEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Empresa'

    # ─── NOTIFICAÇÕES ────────────────────────────────────
    Notificacao:
      type: object
      required: [id, titulo, lida, data_evento]
      properties:
        id:
          type: integer
        titulo:
          type: string
        mensagem:
          type:
            - string
            - 'null'
        tipo:
          type:
            - string
            - 'null'
          description: '# TODO: enum a definir (banco é varchar(50) livre)'
          example: pedido_aprovado
        lida:
          type: boolean
        data_evento:
          type: string
          format: date-time
          example: '2026-10-14T13:22:00Z'
        origem_tabela:
          type:
            - string
            - 'null'
          example: pedido
        origem_id:
          type:
            - integer
            - 'null'
          example: 1234

    NotificacaoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notificacao'

    NaoLidasEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: object
              required: [nao_lidas]
              properties:
                nao_lidas:
                  type: integer

    # ─── CLIENTE ─────────────────────────────────────────
    TipoPessoa:
      type: string
      enum: [PF, PJ]
      description: PF = pessoa física, PJ = pessoa jurídica

    ClienteCreate:
      type: object
      required: [nome_razao_social, tipo_pessoa]
      properties:
        nome_razao_social: { type: string }
        nome_fantasia: { type: string }
        cnpj_cpf: { type: string }
        inscricao_estadual_rg: { type: string }
        tipo_pessoa:
          $ref: '#/components/schemas/TipoPessoa'
        prospect:
          type: boolean
          default: false
        telefone1: { type: string }
        telefone2: { type: string }
        celular: { type: string }
        nome_contato_comprador: { type: string }
        email_contato_comprador: { type: string }
        nome_contato_faturamento: { type: string }
        email_contato_faturamento: { type: string }
        limite_credito_total:
          type: number
          default: 0
        anotacao_erp: { type: string }
        cep: { type: string }
        logradouro: { type: string }
        numero_endereco: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        estado: { type: string }

    ClienteDetalhe:
      allOf:
        - $ref: '#/components/schemas/ClienteCreate'
        - type: object
          properties:
            id:
              type: integer
            codigo_erp:
              type: string
            ativo:
              type: boolean
            data_inclusao:
              type:
                - string
                - 'null'
              format: date-time
            enderecos:
              type: array
              items:
                $ref: '#/components/schemas/Endereco'
            contas_receber:
              type: array
              items:
                $ref: '#/components/schemas/ContaReceber'

    Cliente:
      type: object
      required: [id, codigo_erp, nome_razao_social]
      properties:
        id:
          type: integer
        codigo_erp:
          type: string
        nome_razao_social:
          type: string
        nome_fantasia:
          type:
            - string
            - 'null'
        cnpj_cpf:
          type:
            - string
            - 'null'
        tipo_pessoa:
          oneOf:
            - $ref: '#/components/schemas/TipoPessoa'
            - type: 'null'
        cidade:
          type:
            - string
            - 'null'
        estado:
          type:
            - string
            - 'null'
        ativo:
          type: boolean

    ClienteEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Cliente'

    ClienteDetalheEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ClienteDetalhe'

    ClienteCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Cliente'

    # ─── ENDEREÇO ────────────────────────────────────────
    EnderecoTipo:
      type: string
      enum: [cobranca, entrega, ambos]
      description: |
        C = Cobrança, E = Entrega, A = Ambos (banco tem char(1)).
        # TODO: front usa "residencial" — remapear no front.

    EnderecoCreate:
      type: object
      required: [tipo_endereco, cep, logradouro, numero_endereco, bairro, cidade, estado]
      properties:
        tipo_endereco:
          $ref: '#/components/schemas/EnderecoTipo'
        endereco_padrao:
          type: boolean
          default: false
        cep: { type: string }
        logradouro: { type: string }
        numero_endereco: { type: string }
        complemento_endereco: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        estado: { type: string }
        ponto_referencia: { type: string }
        restricoes_horarios: { type: string }

    Endereco:
      allOf:
        - $ref: '#/components/schemas/EnderecoCreate'
        - type: object
          properties:
            id:
              type: integer
            codigo_erp:
              type: string

    EnderecoEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Endereco'

    EnderecoListEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Endereco'

    # ─── CONTA A RECEBER ─────────────────────────────────
    ContaReceber:
      type: object
      required: [id, valor_total_aberto, situacao]
      properties:
        id:
          type: integer
        codigo_erp:
          type: string
        titulo_numero_documento:
          type:
            - string
            - 'null'
        titulo_especie_documento:
          type:
            - string
            - 'null'
        titulo_serie:
          type:
            - string
            - 'null'
        titulo_numero_parcela:
          type:
            - string
            - 'null'
          example: "1/3"
        data_emissao:
          type:
            - string
            - 'null'
          format: date-time
        data_vencimento:
          type:
            - string
            - 'null'
          format: date-time
        valor_total_aberto:
          type: number
        situacao:
          type: string
          enum: [aberto, vencido, pago]
          description: |
            Derivado no backend:
            - pago: data_liquidacao IS NOT NULL
            - vencido: data_liquidacao IS NULL AND data_vencimento < hoje
            - aberto: caso contrário

    ContaReceberListEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ContaReceber'

    # ─── CEP / CNPJ ──────────────────────────────────────
    CEP:
      type: object
      properties:
        cep: { type: string }
        logradouro: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        estado: { type: string }

    CEPEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CEP'

    ConsultaCnpjEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                cnpj: { type: string }
                razao_social: { type: string }
                nome_fantasia: { type: string }
                inscricao_estadual: { type: string }
                email: { type: string }
                telefone: { type: string }
                endereco:
                  $ref: '#/components/schemas/CEP'

    # ─── PEDIDO ──────────────────────────────────────────
    PedidoTipo:
      type: string
      enum: [pedido, orcamento]

    PedidoStatus:
      type: string
      enum: [em_digitacao, aguardando_aprovacao, aprovado, cancelado]
      description: |
        Fase do pedido no app (`pedido.situacao_app`).
        - em_digitacao: em digitação pelo vendedor
        - aguardando_aprovacao: aguardando aprovação do supervisor
        - aprovado: aprovado
        - cancelado: cancelado

    PedidoStatusErp:
      type: string
      description: |
        Status do ERP (`pedido.situacao_pedido`, char(2) numérico).
        - 1 = Aberto
        - 2 = Cancelado
        - 3 = Faturado Total
        - 4 = Expedido
        - 5 = Entregue
        - 7 = Faturado Parcial/Encerrado
        - 8 = Faturado Parcial/Aberto
        - 11 = Orçamento Revisado
        - 12 = Orçamento Aprovado
      example: "1"

    ProdutoPedido:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        descricao: { type: string }
        familia: { type: string }
        marca: { type: string }
        unidade: { type: string }
        preco_venda: { type: number }
        stock: { type: number }
        peso_liquido: { type: number }
        peso_bruto: { type: number }

    ItemPedido:
      type: object
      required: [sequence, product, quantidade_informada, sale_price]
      properties:
        id:
          type: integer
        sequence:
          type: integer
        product:
          $ref: '#/components/schemas/ProdutoPedido'
        price_table_id:
          type: integer
        price_table_name:
          type: string
        price_table_validity:
          type: string
          format: date-time
        quantidade_informada:
          type: number
        sale_price:
          type: number
          description: Preço praticado (= `preco_venda_praticado_digitado`)
        original_price:
          type: number
          description: Preço sugerido (= `preco_venda_original_sugerido`)
        valor_desconto_comercial:
          type: number
        valor_total_produtos_liquido:
          type: number
        data_entrega:
          type:
            - string
            - 'null'
          format: date-time
        observacao_item:
          type:
            - string
            - 'null'

    PedidoTotais:
      type: object
      properties:
        quantidade_mix: { type: number }
        quantidade_volume: { type: number }
        volume_total_cubico: { type: number }
        peso_liquido: { type: number }
        peso_bruto: { type: number }
        valor_bruto: { type: number }
        valor_desconto: { type: number }
        valor_liquido: { type: number }

    PedidoCreate:
      type: object
      required: [tipo, cliente_id, itens]
      properties:
        tipo:
          $ref: '#/components/schemas/PedidoTipo'
        numero_cliente: { type: string }
        status:
          $ref: '#/components/schemas/PedidoStatus'
        data_emissao:
          type: string
          format: date-time
          description: Opcional; assume a data atual em UTC quando omitida.
        data_entrega:
          type:
            - string
            - 'null'
          format: date-time
        empresa_id: { type: integer }
        cliente_id: { type: integer }
        condicao_pagamento_id: { type: integer }
        forma_pagamento_id: { type: integer }
        transportadora_id: { type: integer }
        endereco_faturamento_id: { type: integer }
        endereco_entrega_id: { type: integer }
        endereco_cobranca_id: { type: integer }
        valor_frete: { type: number }
        observacoes:
          type: string
          description: Alias de `observacoes_pedido`.
        observacoes_pedido: { type: string }
        observacoes_nota_fiscal: { type: string }
        itens:
          type: array
          items:
            $ref: '#/components/schemas/PedidoItemCreate'

    PedidoItemCreate:
      type: object
      description: Aceita o formato plano ou a estrutura legada `product`.
      anyOf:
        - required: [produto_id, quantidade, preco_venda]
        - required: [product, quantidade_informada, sale_price]
      properties:
        produto_id: { type: integer, minimum: 1 }
        quantidade: { type: number, exclusiveMinimum: 0 }
        preco_venda: { type: number, minimum: 0 }
        valor_desconto: { type: number, minimum: 0, default: 0 }
        sequence: { type: integer, minimum: 0 }
        product:
          $ref: '#/components/schemas/ProdutoPedido'
        quantidade_informada: { type: number }
        sale_price: { type: number }
        original_price: { type: number }
        valor_desconto_comercial: { type: number }
        data_entrega:
          type:
            - string
            - 'null'
          format: date-time
        observacao_item:
          type:
            - string
            - 'null'

    Pedido:
      type: object
      required: [id, numero, tipo, status, data_emissao]
      properties:
        id:
          type: integer
        numero:
          type: string
        tipo:
          $ref: '#/components/schemas/PedidoTipo'
        cliente_nome:
          type: string
        data_emissao:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PedidoStatus'
        status_erp:
          oneOf:
            - $ref: '#/components/schemas/PedidoStatusErp'
            - type: 'null'
        status_erp_label:
          type:
            - string
            - 'null'
          example: Aberto
        total_liquido:
          type: number

    PedidoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Pedido'

    PedidoDetalhe:
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          properties:
            codigo_erp: { type: string }
            numero_cliente: { type: string }
            cliente:
              type: object
              properties:
                id: { type: integer }
                nome_razao_social: { type: string }
                cnpj_cpf: { type: string }
            empresa:
              type: object
              properties:
                id: { type: integer }
                nome: { type: string }
            condicao_pagamento:
              type:
                - object
                - 'null'
            forma_pagamento:
              type:
                - object
                - 'null'
            transportadora:
              type:
                - object
                - 'null'
            valor_frete: { type: number }
            observacoes_pedido:
              type:
                - string
                - 'null'
            observacoes_nota_fiscal:
              type:
                - string
                - 'null'
            itens:
              type: array
              items:
                $ref: '#/components/schemas/ItemPedido'
            totais:
              $ref: '#/components/schemas/PedidoTotais'

    PedidoDetalheEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PedidoDetalhe'

    # ─── CATÁLOGOS ───────────────────────────────────────
    EmpresaCatalogo:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        codigo_erp: { type: string }

    EmpresaCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/EmpresaCatalogo'

    CondicaoPagamento:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        descricao: { type: string }
        quantidade_parcelas: { type: integer }
        prazo_medio: { type: integer }

    CondicaoPagamentoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/CondicaoPagamento'

    FormaPagamento:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        descricao: { type: string }

    FormaPagamentoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/FormaPagamento'

    Transportadora:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        nome_razao: { type: string }
        cnpj_cpf: { type: string }

    TransportadoraCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Transportadora'

    TabelaPreco:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        descricao: { type: string }
        vigencia:
          type:
            - string
            - 'null'
          format: date-time
          description: '# TODO: derivar de tabela_preco_item.validade_inicial/final'

    TabelaPrecoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/TabelaPreco'

    Produto:
      type: object
      properties:
        id: { type: integer }
        codigo_erp: { type: string }
        descricao: { type: string }
        familia: { type: string }
        marca: { type: string }
        unidade: { type: string }
        preco_venda: { type: number }
        stock:
          type: number
          description: Soma das quantidades registradas em item_estoque para o produto.
        tabela_preco_padrao_id:
          type: integer
          description: '# TODO: schema não tem "tabela padrão do produto"'

    ProdutoCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Produto'

    # ─── AGENDA ──────────────────────────────────────────
    AgendaCreate:
      type: object
      required: [titulo, data_agendada]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        codigo_erp_cliente:
          type: string
          description: Código ERP do cliente vinculado (opcional). O backend resolve via `cliente.codigo_erp`.
        data_agendada:
          type: string
          format: date-time
        hora_agendada:
          type:
            - string
            - 'null'
          example: "14:30:00"

    Agenda:
      allOf:
        - $ref: '#/components/schemas/AgendaCreate'
        - type: object
          properties:
            id: { type: integer }
            cod_usuario: { type: integer }
            concluida: { type: boolean }
            dt_inclusao:
              type: string
              format: date-time
            dt_alteracao:
              type: string
              format: date-time

    AgendaEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Agenda'

    AgendaCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Agenda'

    # ─── TAREFA ──────────────────────────────────────────
    TarefaCreate:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        prazo:
          type:
            - string
            - 'null'
          format: date-time
        prioridade:
          type: string
          enum: [baixa, media, alta]
          default: media

    Tarefa:
      allOf:
        - $ref: '#/components/schemas/TarefaCreate'
        - type: object
          properties:
            id: { type: integer }
            cod_usuario: { type: integer }
            concluida: { type: boolean }
            dt_inclusao:
              type: string
              format: date-time
            dt_alteracao:
              type: string
              format: date-time

    TarefaEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Tarefa'

    TarefaCursorEnvelope:
      allOf:
        - $ref: '#/components/schemas/APIResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tarefa'                  
