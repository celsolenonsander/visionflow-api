openapi: 3.1.0
info:
  title: VisionFlow API
  version: 1.0.0
  description: |
    API REST do VisionFlow — SaaS multi-tenant de força de vendas.

    ## Convenções
    - **Envelope**: todas as respostas seguem `{ success, data, error }`.
    - **Multi-tenant**: `cod_tenant` e `cod_empresa` NÃO trafegam na API;
      o backend resolve via JWT + `usuario_empresa.empresa_padrao` e injeta
      `SET LOCAL app.cod_tenant / app.cod_empresa`. RLS filtra automaticamente.
    - **Snake_case**: todos os campos JSON são `snake_case`.
    - **IDs**: cada entidade expõe `id` (= `codigo` do banco, int) e `codigo_erp` (string).
    - **Paginação**: cursor por `codigo` do último item. Sem `total`, sem `hasMore`.
    - **Datas**: ISO 8601 com timezone UTC (`2026-10-14T15:30:00Z`).
      Campos `date` do banco viram `2026-10-14T00:00:00Z`.
    - **Dinheiro**: `number` (float64). Front formata para BRL.

servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://api.visionflow.com.br
    description: Produção (placeholder)

tags:
  - name: auth
    description: Autenticação
  - name: home
    description: Indicadores da Home
  - name: shell
    description: Dados do shell autenticado (empresa + usuário)
  - name: notificacoes
    description: Avisos e notificações
  - name: clientes
    description: Cadastro de clientes, endereços e títulos
  - name: pedidos
    description: Pedidos de venda
  - name: orcamentos
    description: Orçamentos (mesma estrutura do pedido, flag `e_um_orcamento`)
  - name: catalogo
    description: Catálogos auxiliares (read-only)
  - name: agenda
    description: Agenda de visitas/compromissos
  - name: tarefa
    description: Tarefas do usuário

security:
  - bearerAuth: []

paths:
  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar usuário
      description: |
        Retorna o usuário autenticado e um JWT (HS256, exp 8h).
        Claims: `sub` (cod_usuario), `iat`, `exp`.
        Não expõe `cod_tenant`/`cod_empresa` no token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valido:
                summary: Credenciais válidas
                value:
                  email: vendedor@distribuidora.com.br
                  senha: Senha@123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      usuario:
                        id: 42
                        nome: João da Silva
                        email: vendedor@distribuidora.com.br
                        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    error: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                invalido:
                  value:
                    success: false
                    data: null
                    error:
                      code: CREDENCIAIS_INVALIDAS
                      message: E-mail ou senha incorretos.
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Encerrar sessão
      description: |
        Invalida a sessão no cliente. Hoje é stateless (apenas 200).
        # TODO: definir se haverá blacklist de token no backend.
      responses:
        '200':
          description: Logout efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                sucesso:
                  value:
                    success: true
                    data: null
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════════════════════
  # HOME
  # ═══════════════════════════════════════════════════════════
  /home/indicadores:
    get:
      tags: [home]
      summary: Indicadores da Home
      description: |
        Contadores e somas exibidos na Home. Todos derivados (sem tabela própria).
        - `pending_agendas` e `pending_tasks` derivam de `agenda` e `tarefa`.
        - `unread_notifications` deriva de `notificacao` (lida = false).
        - `sales_this_month` e `sales_today` somam
          `pedido_item.valor_total_produtos_liquido` de pedidos (não orçamentos)
          que não foram marcados para remoção.
        - `clientes_em_digitacao` conta clientes distintos com pedido ou orçamento
          em `situacao_app = em_digitacao`, usando `pedido.codigo_erp_cliente`.
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadorEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      vendas_mes: 125430.50
                      vendas_hoje: 3890.00
                      pedidos_em_digitacao: 7
                      orcamentos_em_digitacao: 3
                      clientes_em_digitacao: 2
                      pedidos_aguardando_aprovacao: 4
                      agendas_pendentes: 5
                      tarefas_pendentes: 8
                      notificacoes_nao_lidas: 12
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ═══════════════════════════════════════════════════════════
  # SHELL
  # ═══════════════════════════════════════════════════════════
  /shell/empresa:
    get:
      tags: [shell]
      summary: Empresa e usuário da sessão
      description: |
        Dados da empresa padrão (via `usuario_empresa.empresa_padrao`) e do usuário logado.
        `regional` vem de `empresa.regional`.
      responses:
        '200':
          description: Dados da empresa e usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      nome: Distribuidora Central LTDA
                      cnpj: 12.345.678/0001-90
                      regional: Sudeste
                      contato: contato@distribuidoracentral.com.br
                      usuario_logado:
                        id: 42
                        nome: João da Silva
                        email: vendedor@distribuidora.com.br
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /shell/notificacoes:
    get:
      tags: [shell]
      deprecated: true
      summary: '[DEPRECATED] Contador de não lidas'
      description: |
        Alias mantido para compatibilidade com o front atual.

        **Migrar para** `GET /notificacoes/nao-lidas/count`
        (1 linha em `ApiShellRepository.ts`).
      responses:
        '200':
          description: Contador (mesmo schema do endpoint consolidado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaoLidasEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════════════════════
  # NOTIFICAÇÕES
  # ═══════════════════════════════════════════════════════════
  /notificacoes:
    get:
      tags: [notificacoes]
      summary: Listar notificações
      description: Lista paginada por cursor, ordem decrescente de `data_evento`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - name: lida
          in: query
          description: Filtrar por status de leitura
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de notificações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacaoCursorEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      items:
                        - id: 501
                          titulo: Pedido #1234 aprovado
                          mensagem: O pedido foi aprovado pelo supervisor.
                          tipo: pedido_aprovado
                          lida: false
                          data_evento: '2026-10-14T13:22:00Z'
                          origem_tabela: pedido
                          origem_id: 1234
                      nextCursor: "501"
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /notificacoes/nao-lidas/count:
    get:
      tags: [notificacoes]
      summary: Contador de notificações não lidas
      description: |
        Retorna apenas o contador para o badge do shell.
        Substitui `/shell/notificacoes` (deprecated).
      responses:
        '200':
          description: Contador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaoLidasEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      nao_lidas: 12
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════════════════════════════════════
  # CLIENTES
  # ═══════════════════════════════════════════════════════════
  /clientes:
    get:
      tags: [clientes]
      summary: Listar clientes
      parameters:
        - name: busca
          in: query
          description: Busca por razão social, fantasia ou CNPJ/CPF
          schema:
            type: string
        - name: status
          in: query
          description: Filtro por situação
          schema:
            type: string
            enum: [ativo, inativo, prospect]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCursorEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      items:
                        - id: 24129
                          codigo_erp: "A001"
                          nome_razao_social: Supermercado Bom Preço LTDA
                          nome_fantasia: Bom Preço
                          cnpj_cpf: 61.186.888/0001-93
                          tipo_pessoa: PJ
                          cidade: São Paulo
                          estado: SP
                          ativo: true
                      nextCursor: "24129"
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [clientes]
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
            examples:
              novo:
                value:
                  nome_razao_social: Mercadinho do Zé LTDA
                  nome_fantasia: Mercadinho do Zé
                  cnpj_cpf: 12.345.678/0001-90
                  tipo_pessoa: PJ
                  telefone1: (11) 3456-7890
                  email_contato_comprador: compras@mercadinhoze.com.br
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: CNPJ/CPF já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                duplicado:
                  value:
                    success: false
                    data: null
                    error:
                      code: CLIENTE_JA_EXISTE
                      message: Já existe um cliente com este CNPJ/CPF.
        '500':
          $ref: '#/components/responses/InternalError'

  /clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [clientes]
      summary: Obter cliente
      responses:
        '200':
          description: Detalhe do cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalheEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      id: 24129
                      codigo_erp: "A001"
                      nome_razao_social: Supermercado Bom Preço LTDA
                      nome_fantasia: Bom Preço
                      cnpj_cpf: 61.186.888/0001-93
                      tipo_pessoa: PJ
                      prospect: false
                      ativo: true
                      limite_credito_total: 50000.00
                      data_inclusao: '2023-03-15T00:00:00Z'
                      anotacao_erp: Cliente preferencial.
                      enderecos: []
                      contas_receber: []
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [clientes]
      summary: Atualizar cliente
      description: Atualiza os campos do cliente sem alterar `codigo_erp`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCreate'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [clientes]
      summary: Remover cliente
      description: Soft delete; o registro recebe `deletado_em` e deixa de aparecer nas consultas.
      responses:
        '200':
          description: Cliente removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/cnpj/{cnpj}:
    get:
      tags: [clientes]
      summary: Consultar CNPJ (integração externa)
      parameters:
        - name: cnpj
          in: path
          required: true
          schema:
            type: string
          example: "61186888000193"
      responses:
        '200':
          description: Dados do CNPJ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaCnpjEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      cnpj: "61.186.888/0001-93"
                      razao_social: Supermercado Bom Preço LTDA
                      nome_fantasia: Bom Preço
                      inscricao_estadual: "123.456.789.012"
                      email: contato@bompreco.com.br
                      telefone: (11) 3456-7890
                      endereco:
                        cep: "01310-100"
                        logradouro: Avenida Paulista
                        numero: "1000"
                        complemento: Sala 501
                        bairro: Bela Vista
                        cidade: São Paulo
                        estado: SP
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /clientes/{id}/enderecos:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [clientes]
      summary: Listar endereços do cliente
      responses:
        '200':
          description: Endereços
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoListEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      - id: 15
                        codigo_erp: "E001"
                        tipo_endereco: entrega
                        endereco_padrao: true
                        cep: "01310-100"
                        logradouro: Avenida Paulista
                        numero_endereco: "1000"
                        complemento_endereco: Sala 501
                        bairro: Bela Vista
                        cidade: São Paulo
                        estado: SP
                        ponto_referencia: Próximo ao MASP
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [clientes]
      summary: Criar endereço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoCreate'
      responses:
        '201':
          description: Endereço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{id}/enderecos/{enderecoId}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - name: enderecoId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [clientes]
      summary: Remover endereço
      description: Soft delete do endereço vinculado ao cliente.
      responses:
        '200':
          description: Endereço removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{id}/contas-receber:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [clientes]
      summary: Contas a receber do cliente (read-only)
      description: |
        Títulos em aberto do cliente, ordenados por vencimento (vencidos primeiro).
        Filtra por `codigo_erp_cliente` derivado do `{id}` do cliente + sessão.
        `situacao` é derivada no backend.
      responses:
        '200':
          description: Títulos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaReceberListEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      - id: 8821
                        codigo_erp: "T0001"
                        titulo_numero_documento: "NF 12345"
                        titulo_especie_documento: NF
                        titulo_serie: "1"
                        titulo_numero_parcela: "1/3"
                        data_emissao: '2026-08-15T00:00:00Z'
                        data_vencimento: '2026-09-15T00:00:00Z'
                        valor_total_aberto: 1500.00
                        situacao: vencido
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cep/{cep}:
    get:
      tags: [clientes]
      summary: Consultar CEP (integração externa)
      parameters:
        - name: cep
          in: path
          required: true
          schema:
            type: string
          example: "01310100"
      responses:
        '200':
          description: Dados do CEP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CEPEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      cep: "01310-100"
                      logradouro: Avenida Paulista
                      bairro: Bela Vista
                      cidade: São Paulo
                      estado: SP
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  # ═══════════════════════════════════════════════════════════
  # PEDIDOS
  # ═══════════════════════════════════════════════════════════
  /pedidos:
    get:
      tags: [pedidos]
      summary: Listar pedidos
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PedidoStatus'
        - name: cliente_id
          in: query
          schema:
            type: integer
        - name: incluir_cancelados
          in: query
          description: Inclui pedidos cancelados na listagem, ocultos por padrão.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoCursorEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      items:
                        - id: 1001
                          numero: "1234"
                          tipo: pedido
                          cliente_nome: Supermercado Bom Preço LTDA
                          data_emissao: '2026-10-14T00:00:00Z'
                          status: em_digitacao
                          status_erp: "1"
                          status_erp_label: Aberto
                          total_liquido: 3890.00
                      nextCursor: "1001"
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [pedidos]
      summary: Criar pedido
      description: Cria o pedido e seus itens de forma atômica. `data_emissao` é opcional e, quando omitida, usa a data atual em UTC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalheEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [pedidos]
      summary: Obter pedido
      responses:
        '200':
          description: Detalhe do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalheEnvelope'
              examples:
                sucesso:
                  value:
                    success: true
                    data:
                      id: 1001
                      codigo_erp: "P0001"
                      numero: "1234"
                      tipo: pedido
                      status: em_digitacao
                      status_erp: "1"
                      status_erp_label: Aberto
                      data_emissao: '2026-10-14T00:00:00Z'
                      cliente:
                        id: 24129
                        nome_razao_social: Supermercado Bom Preço LTDA
                        cnpj_cpf: 61.186.888/0001-93
                      valor_frete: 50.00
                      observacoes_pedido: Entregar após 14h.
                      itens:
                        - id: 5001
                          sequence: 1
                          product:
                            id: 88
                            codigo_erp: "PROD-88"
                            descricao: Refrigerante Cola 2L
                            marca: Coca-Cola
                            unidade: UN
                            preco_venda: 8.50
                          quantidade_informada: 10
                          sale_price: 8.50
                          original_price: 9.00
                          valor_desconto_comercial: 5.00
                          valor_total_produtos_liquido: 80.00
                      totais:
                        quantidade_mix: 1
                        quantidade_volume: 10
                        volume_total_cubico: 0.08
                        peso_liquido: 20.0
                        peso_bruto: 21.0
                        valor_bruto: 85.00
                        valor_desconto: 5.00
                        valor_liquido: 80.00
                    error: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [pedidos]
      summary: Atualizar pedido
      description: |
        Substitui os itens do pedido dentro de uma transação. A edição é permitida
        em qualquer situação, inclusive aprovado; se o ERP já processou o pedido,
        a alteração não será propagada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalheEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [pedidos]
      summary: Cancelar pedido
      description: Define `situacao_app=cancelado`; o pedido não é excluído fisicamente e fica oculto da listagem padrão.
      responses:
        '200':
          description: Pedido cancelado
